name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore OrlandoUp.sln

      - name: Build
        run: dotnet build OrlandoUp.sln --no-restore --nologo

      # No database on the runner: the integration tests use SQLite in memory and the
      # connection string key is injected by the test host, never read from a file.
      - name: Test
        run: dotnet test OrlandoUp.sln --no-build --nologo
